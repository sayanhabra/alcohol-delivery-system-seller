name: adm_seller
description: "A new Flutter project."
publish_to: "none" 

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  pretty_dio_logger: ^1.4.0
  dio: ^5.10.0
  # fpdart: ^1.2.0
  # hive_flutter: ^1.1.0
  # hive: ^2.2.3
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  google_maps_flutter: ^2.17.1
  razorpay_flutter: ^1.4.5
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  # map_location_picker: ^3.1.0
  # hooks_riverpod: ^3.3.2
  # animated_text_kit: ^4.3.0
  # flutter_modular: ^7.1.0
  # flutter_animate: ^4.5.2
  flutter_riverpod: ^3.3.2
  bot_toast: ^4.1.3
  go_router: ^17.3.0
  # liquid_pull_to_refresh: ^3.0.1
  firebase_core:
  firebase_messaging:
  firebase_analytics:
  firebase_crashlytics:
  firebase_remote_config:
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.2
  intl: ^0.20.3
  lottie: ^3.5.1
  custom_dropdown_pro: ^0.0.7
  # cookie_jar: ^4.0.9
  # dio_cookie_manager: ^3.5.0

dependency_overrides:
  path_provider_android: 2.2.19

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/png/
    - assets/svg/
    - assets/jpg/
    - assets/animation/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
